<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Setup Sheet & Service Barcodes</title>
    <meta name="theme-color" content="#4b0082">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Libre+Barcode+39&display=swap" rel="stylesheet">
    <style>
        :root {
            --main-purple: #9b51e0;
            --light-purple: #f3e8ff;
            --label-purple: #8a2be2;
            --white: #ffffff;
            --app-bg: #e2d5f8;
            --poor-color: #d9534f;
            --good-color: #2e7d32;
        }

        body {
            margin: 0;
            padding: 20px;
            background-color: var(--app-bg);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
        }

        /* App Toolbar Styling */
        .app-toolbar {
            width: 100%;
            max-width: 210mm;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            background: var(--white);
            padding: 10px 15px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            box-sizing: border-box;
        }

        .toolbar-group {
            display: flex;
            gap: 10px;
        }

        .app-btn {
            background-color: var(--light-purple);
            color: var(--main-purple);
            border: 2px solid var(--main-purple);
            padding: 8px 14px;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .app-btn:hover {
            background-color: var(--main-purple);
            color: var(--white);
        }

        .app-btn.primary {
            background-color: var(--main-purple);
            color: var(--white);
        }

        .app-btn.primary:hover {
            background-color: #8a2be2;
        }

        /* Responsive A4 Paper Styling */
        .a4-sheet {
            width: 100%;
            max-width: 210mm;
            min-height: 297mm;
            background-color: var(--white);
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.15);
            padding: 12mm 15mm;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            margin: 0 auto;
            border-radius: 4px;
        }

        /* Header Section */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 3px solid var(--main-purple);
            padding-bottom: 12px;
            margin-bottom: 15px;
        }

        .header h1 {
            color: var(--main-purple);
            margin: 0;
            font-size: 42px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .header-colleague-container {
            display: flex;
            flex-direction: column;
            gap: 5px;
            max-width: 260px;
            width: 100%;
        }

        /* Device Icon Container */
        .device-icon-container {
            width: 75px;
            height: 75px;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-shrink: 0;
        }

        .device-icon-container svg {
            width: 100%;
            height: 100%;
        }

        /* Form Grid Layout */
        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px 20px;
            margin-bottom: 20px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .form-group.dob-group {
            text-align: center;
        }

        .full-width {
            grid-column: span 2;
        }

        /* Date of Birth Input Container */
        .dob-container {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        .dob-container input {
            text-align: center;
        }

        .dob-container input#dobDay,
        .dob-container input#dobMonth {
            width: 65px;
        }

        .dob-container input#dobYear {
            width: 95px;
        }

        .dob-separator {
            font-size: 18px;
            font-weight: bold;
            color: var(--main-purple);
            user-select: none;
        }

        /* Form Elements Styling */
        label {
            color: var(--label-purple);
            font-weight: bold;
            font-size: 14px;
        }

        input[type="text"],
        input[type="email"],
        select,
        textarea {
            width: 100%;
            padding: 8px 10px;
            border: 2px solid #d8b4fe;
            border-radius: 6px;
            font-size: 15px;
            box-sizing: border-box;
            color: #333;
            background-color: var(--white);
            transition: border-color 0.2s;
            font-family: inherit;
        }

        textarea#address {
            resize: vertical;
            min-height: 8.5em;
            line-height: 1.4;
        }

        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: var(--main-purple);
            background-color: var(--light-purple);
        }

        /* Section Titles */
        .section-title {
            color: var(--main-purple);
            border-bottom: 2px solid var(--light-purple);
            padding-bottom: 5px;
            margin: 0 0 15px 0;
            font-size: 18px;
            text-transform: uppercase;
        }

        /* Services Grid - Two Rows & Even Spread */
        .services-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            margin-bottom: 20px;
            width: 100%;
        }

        .service-card {
            background-color: var(--light-purple);
            border: 2px solid var(--main-purple);
            border-radius: 8px;
            padding: 10px 12px;
            display: flex;
            flex-direction: column;
            gap: 6px;
            justify-content: center;
            align-items: center;
            text-align: center;
            flex: 1 1 calc(22% - 10px);
            min-width: 130px;
            box-sizing: border-box;
        }

        .pen-tick-box {
            width: 16px;
            height: 16px;
            border: 2px solid var(--main-purple);
            border-radius: 3px;
            background-color: var(--white);
            flex-shrink: 0;
        }

        .service-card label {
            color: var(--main-purple);
            font-size: 14px;
            margin: 0;
            text-align: center;
        }

        .service-card select {
            border: 1px solid var(--main-purple);
            padding: 6px;
            text-align: center;
        }

        .service-card.checkbox-card {
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 6px;
            cursor: pointer;
            text-align: center;
        }

        .service-card.checkbox-card input[type="checkbox"] {
            width: 18px;
            height: 18px;
            accent-color: var(--main-purple);
            cursor: pointer;
            margin: 0;
        }

        .service-card.checkbox-card span {
            cursor: pointer;
            color: var(--main-purple);
            font-weight: bold;
            font-size: 14px;
            text-align: center;
        }

        /* Service Barcode Section Styling */
        .service-vouchers-container {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 20px;
            background: #ffffff;
            border-radius: 8px;
        }

        .voucher-cat-title {
            color: var(--main-purple);
            font-size: 16px;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            border-bottom: 2px solid var(--main-purple);
            padding-bottom: 4px;
            margin: 10px 0 6px 0;
        }

        .voucher-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 12px;
        }

        .voucher-card {
            background: var(--white);
            border: 2px solid var(--main-purple);
            border-radius: 8px;
            padding: 10px 8px;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
            transition: transform 0.15s, box-shadow 0.15s;
        }

        .voucher-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 10px rgba(155, 81, 224, 0.25);
            background: #faf5ff;
        }

        .voucher-name {
            font-weight: bold;
            font-size: 13px;
            color: #222;
            margin-bottom: 6px;
            min-height: 28px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .barcode-svg-container {
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 4px 0;
            background: #ffffff;
            padding: 4px 0;
        }

        .voucher-code {
            font-size: 14px;
            font-weight: 800;
            color: var(--main-purple);
            letter-spacing: 2px;
            font-family: monospace;
            background: var(--light-purple);
            padding: 3px 8px;
            border-radius: 4px;
            margin-top: 4px;
            width: calc(100% - 16px);
            box-sizing: border-box;
        }

        /* Promo Banner & Notes */
        .promo-banner {
            background-color: var(--light-purple);
            border: 1.5px dashed var(--main-purple);
            padding: 5px 8px;
            border-radius: 6px;
            margin-bottom: 4px;
            font-size: 11px;
            color: var(--main-purple);
            font-weight: 600;
            line-height: 1.25;
            text-align: center;
            display: none;
        }

        .notes-section {
            display: flex;
            flex-direction: column;
            gap: 3px;
        }

        /* Second Page Flyer Sheet Styles */
        .a4-sheet.second-page {
            display: none;
            flex-direction: column;
            margin-top: 20px;
            padding: 0;
            overflow: hidden;
        }

        .flyer-container {
            display: flex;
            height: 100%;
            min-height: 297mm;
            box-sizing: border-box;
            flex-grow: 1;
        }

        /* Width of standard receipt (~80mm) */
        .flyer-receipt-side {
            width: 80mm;
            background-color: var(--light-purple);
            border-right: 2.5px dashed var(--main-purple);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px 0;
            box-sizing: border-box;
            flex-shrink: 0;
        }

        .vertical-receipt-text {
            writing-mode: vertical-rl;
            transform: rotate(180deg);
            color: #d8b4fe;
            font-size: 22px;
            font-weight: 800;
            letter-spacing: 3px;
            text-transform: uppercase;
            white-space: nowrap;
            user-select: none;
        }

        .flyer-main-content {
            flex-grow: 1;
            padding: 12mm 15mm 12mm 25px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            box-sizing: border-box;
        }

        .flyer-header-title {
            color: var(--main-purple);
            font-size: 30px;
            font-weight: 800;
            text-align: center;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            margin: 0 0 16px 0;
            padding-bottom: 6px;
            border-bottom: 3px solid var(--main-purple);
        }

        .tips-cards-container {
            display: flex;
            flex-direction: column;
            gap: 16px;
            flex-grow: 1;
            justify-content: space-around;
        }

        .tip-card {
            background-color: var(--light-purple);
            border: 2px solid #d8b4fe;
            border-radius: 10px;
            padding: 14px 18px;
            text-align: center;
            font-size: 14.5px;
            line-height: 1.5;
            color: #222;
            box-shadow: 0 3px 8px rgba(155, 81, 224, 0.12);
        }

        .survey-card {
            background-color: var(--light-purple);
            border: 2px solid #d8b4fe;
            border-radius: 10px;
            padding: 14px 18px;
            box-shadow: 0 3px 8px rgba(155, 81, 224, 0.12);
        }

        .survey-intro-text {
            margin: 0 0 10px 0;
            font-size: 12.5px;
            font-weight: 600;
            color: #333;
            text-align: center;
            line-height: 1.35;
        }

        .survey-ratings-header {
            display: flex;
            justify-content: space-between;
            font-weight: 800;
            font-size: 13px;
            margin-bottom: 6px;
            padding: 0 2px;
        }

        .poor-label {
            color: var(--poor-color);
        }

        .good-label {
            color: var(--good-color);
        }

        .survey-boxes-grid {
            display: flex;
            gap: 4px;
        }

        .survey-boxes-grid .s-box {
            flex: 1;
            text-align: center;
            padding: 8px 0;
            font-weight: bold;
            font-size: 13px;
            border-radius: 4px;
            color: white;
        }

        .survey-boxes-grid .s-box.poor {
            background-color: var(--poor-color);
        }

        .survey-boxes-grid .s-box.good {
            background-color: var(--good-color);
        }

        /* Third Page (Trade-In Guide) Styles */
        .third-page {
            display: none;
            flex-direction: column;
            margin-top: 20px;
        }

        /* Mobile Responsiveness */
        @media (max-width: 700px) {
            .app-toolbar {
                flex-direction: column;
                gap: 10px;
            }
            .header {
                flex-direction: column;
                gap: 10px;
                align-items: flex-start;
            }
            .form-grid {
                grid-template-columns: 1fr;
            }
            .full-width {
                grid-column: span 1;
            }
            .services-grid {
                display: grid;
                grid-template-columns: 1fr 1fr !important;
            }
            .service-card {
                flex: unset;
                width: 100%;
            }
            .voucher-grid {
                grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
            }
            .flyer-container {
                flex-direction: column;
                min-height: auto;
            }
            .flyer-receipt-side {
                width: 100%;
                height: 70px;
                border-right: none;
                border-bottom: 2.5px dashed var(--main-purple);
            }
            .vertical-receipt-text {
                writing-mode: horizontal-tb;
                transform: none;
            }
            .flyer-main-content {
                padding: 15px;
            }
        }

        /* Print Settings */
        @page {
            size: A4;
            margin: 0;
        }

        @media print {
            body {
                background: none;
                padding: 0;
                margin: 0;
            }
            .app-toolbar {
                display: none !important;
            }
            .a4-sheet {
                box-shadow: none;
                padding: 12mm 15mm !important;
                width: 210mm !important;
                min-height: 297mm !important;
                border-radius: 0;
                margin: 0;
                page-break-after: always;
            }
            .a4-sheet.second-page {
                padding: 0 !important;
            }
            .a4-sheet:last-child {
                page-break-after: auto;
            }
            .flyer-container {
                flex-direction: row !important;
                min-height: 297mm !important;
            }
            .flyer-receipt-side {
                width: 80mm !important;
                background-color: var(--light-purple) !important;
                border-right: 2.5px dashed var(--main-purple) !important;
                border-bottom: none !important;
                -webkit-print-color-adjust: exact !important;
                print-color-adjust: exact !important;
            }
            .vertical-receipt-text {
                writing-mode: vertical-rl !important;
                transform: rotate(180deg) !important;
            }
            .flyer-main-content {
                padding: 12mm 15mm 12mm 25px !important;
            }
            .voucher-card {
                break-inside: avoid;
                border: 1.5px solid var(--main-purple) !important;
                -webkit-print-color-adjust: exact !important;
                print-color-adjust: exact !important;
            }
            .voucher-code {
                background-color: var(--light-purple) !important;
                -webkit-print-color-adjust: exact !important;
                print-color-adjust: exact !important;
            }
        }
    </style>
</head>
<body>

    <!-- App Control Toolbar -->
    <div class="app-toolbar">
        <div class="toolbar-group">
            <button class="app-btn" onclick="clearAppData()">🗑️ Clear Form</button>
        </div>
        <div class="toolbar-group">
            <button class="app-btn primary" onclick="window.print()">🖨️ Print</button>
        </div>
    </div>

    <!-- Main Page: Setup Sheet / Services Barcodes -->
    <div class="a4-sheet">
        <header class="header">
            <div>
                <h1 id="page-main-title">Setup Sheet</h1>
                <p id="page-sub-title" style="color: var(--main-purple); margin: 3px 0 0 0; font-weight: bold; font-size: 13px;">Device Configuration & Services</p>
            </div>
            
            <div class="header-colleague-container" id="header-colleague-container">
                <label for="colleagueName">You were served by</label>
                <input type="text" id="colleagueName" placeholder="First Name" autocomplete="off">
            </div>

            <div class="device-icon-container" id="icon-container"></div>
        </header>

        <!-- Customer & Device Details Form -->
        <div id="customer-fields-container">
            <form class="form-grid" id="setup-form" autocomplete="off">
                <div class="form-group" id="device-selector-group">
                    <label for="device">Device Type</label>
                    <select id="device" onchange="handleDeviceChange()">
                        <option value="none">-- Select --</option>
                        <option value="laptop">Laptop</option>
                        <option value="aio">All in one</option>
                        <option value="tower">Tower</option>
                        <option value="mobile">Mobile phone</option>
                        <option value="tablet">Tablet</option>
                        <option value="services">Services</option>
                    </select>
                </div>

                <div class="form-group customer-only-field">
                    <label for="customerName">Customer Name</label>
                    <input type="text" id="customerName" placeholder="Enter full name" autocomplete="off">
                </div>

                <div class="form-group customer-only-field">
                    <label for="item">Item</label>
                    <input type="text" id="item" placeholder="Enter item" autocomplete="off">
                </div>

                <div class="form-group customer-only-field">
                    <label for="productCode">Product Code</label>
                    <input type="text" id="productCode" placeholder="e.g. LAP123" autocomplete="off">
                </div>

                <div class="form-group customer-only-field">
                    <label for="receiptCur">Receipt / CUR</label>
                    <input type="text" id="receiptCur" placeholder="Enter Receipt / CUR" autocomplete="off">
                </div>

                <div class="form-group customer-only-field">
                    <label for="medics">Medics</label>
                    <input type="text" id="medics" placeholder="Enter Medics" autocomplete="off">
                </div>

                <div class="form-group customer-only-field">
                    <label for="contactNumber">Best Contact Number</label>
                    <input type="text" id="contactNumber" placeholder="Enter phone number" autocomplete="off">
                </div>

                <div class="form-group customer-only-field">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" placeholder="Enter email address" autocomplete="email">
                </div>

                <div class="form-group customer-only-field">
                    <label for="altEmail">Alternative Email Address</label>
                    <input type="email" id="altEmail" placeholder="Enter alternative email address" autocomplete="email">
                </div>

                <div class="form-group dob-group customer-only-field">
                    <label>Date of Birth <span style="font-weight: normal; font-size: 0.9em;">(for account creation)</span></label>
                    <div class="dob-container">
                        <input type="text" id="dobDay" placeholder="DD" maxlength="2" autocomplete="off">
                        <span class="dob-separator">/</span>
                        <input type="text" id="dobMonth" placeholder="MM" maxlength="2" autocomplete="off">
                        <span class="dob-separator">/</span>
                        <input type="text" id="dobYear" placeholder="YYYY" maxlength="4" autocomplete="off">
                    </div>
                </div>

                <div class="form-group full-width customer-only-field">
                    <label for="address">Full Address</label>
                    <textarea id="address" rows="4" placeholder="Enter customer's full address" autocomplete="off"></textarea>
                </div>

                <div class="form-group customer-only-field">
                    <label for="password">Password</label>
                    <input type="text" id="password" placeholder="Account Password" autocomplete="new-password">
                </div>

                <div class="form-group customer-only-field">
                    <label for="pin">Pin</label>
                    <input type="text" id="pin" placeholder="Device PIN" autocomplete="new-password">
                </div>

                <div class="form-group customer-only-field" id="imei-group" style="display: none;">
                    <label for="imei">IMEI number (Trade in)</label>
                    <input type="text" id="imei" placeholder="Enter IMEI number" autocomplete="off">
                </div>

                <div class="form-group customer-only-field" id="preorder-group" style="display: none;">
                    <label for="preorder">Pre-order</label>
                    <select id="preorder">
                        <option value="">-- Select --</option>
                        <option value="yes">Yes</option>
                        <option value="no">No</option>
                    </select>
                </div>
            </form>
        </div>

        <!-- Service Barcode Sheet Container -->
        <div class="service-vouchers-container" id="service-vouchers-container" style="display: none;">
            <h3 class="section-title" style="margin-bottom: 2px;">Service Codes & Barcodes Reference</h3>
            <div id="vouchers-content"></div>
        </div>

        <!-- Services & Protection Grid -->
        <div id="services-grid-wrapper">
            <h3 class="section-title">Services & Protection</h3>
            <div class="services-grid" id="services-grid">
                <div class="service-card" id="antivirus-card">
                    <div class="pen-tick-box"></div>
                    <label for="antivirus">Anti-virus</label>
                    <select id="antivirus"></select>
                </div>

                <div class="service-card" id="office-card">
                    <div class="pen-tick-box"></div>
                    <label for="office">Office</label>
                    <select id="office"></select>
                </div>

                <div class="service-card" id="privacy-card">
                    <div class="pen-tick-box"></div>
                    <label for="privacyGuard">Privacy Guard</label>
                    <select id="privacyGuard"></select>
                </div>

                <div class="service-card" id="zagg-card">
                    <div class="pen-tick-box"></div>
                    <label for="zagg">Zagg Screen Protector</label>
                    <select id="zagg"></select>
                </div>

                <label class="service-card checkbox-card" id="cloud-card">
                    <div class="pen-tick-box"></div>
                    <span>Cloud Storage</span>
                    <input type="checkbox" id="cloudCheck"> 
                </label>

                <label class="service-card checkbox-card" id="vpn-card">
                    <div class="pen-tick-box"></div>
                    <span>VPN Service</span>
                    <input type="checkbox" id="vpnCheck"> 
                </label>

                <label class="service-card checkbox-card" id="data-card">
                    <div class="pen-tick-box"></div>
                    <span>Data Transfer</span>
                    <input type="checkbox" id="dataCheck"> 
                </label>

                <label class="service-card checkbox-card" id="iphone-trade-in-card" style="display: none;">
                    <div class="pen-tick-box"></div>
                    <span>iPhone trade in</span>
                    <input type="checkbox" id="iphoneTradeInCheck" onchange="updateTradeInSheet()"> 
                </label>

                <label class="service-card checkbox-card" id="android-trade-in-card" style="display: none;">
                    <div class="pen-tick-box"></div>
                    <span>Android trade in</span>

        function generateCode39SVG(code) {
            const charWidths = {
                '0': [1,1,1,1,2,2,2,1,1],
                '1': [2,1,1,1,1,2,1,1,2],
                '2': [1,1,2,1,1,2,1,1,2],
                '3': [2,1,2,1,1,2,1,1,1],
                '4': [1,1,1,1,2,2,1,1,2],
                '5': [2,1,1,1,2,2,1,1,1],
                '6': [1,1,2,1,2,2,1,1,1],
                '7': [1,1,1,1,1,2,2,1,2],
                '8': [2,1,1,1,1,2,2,1,1],
                '9': [1,1,2,1,1,2,2,1,1],
                '*': [1,2,1,1,2,1,2,1,1]
            };

            const fullCode = '*' + code + '*';
            let bars = '';
            let x = 10;
            const narrow = 2;
            const wide = 5;
            const height = 45;

            for (let c of fullCode) {
                const widths = charWidths[c] || charWidths['0'];
                for (let i = 0; i < 9; i++) {
                    const w = widths[i] === 2 ? wide : narrow;
                    const isBar = (i % 2 === 0);
                    if (isBar) {
                        bars += `<rect x="${x}" y="0" width="${w}" height="${height}" fill="#000000"/>`;
                    }
                    x += w;
                }
                x += narrow;
            }

            return `<svg viewBox="0 0 ${x + 10} ${height}" preserveAspectRatio="none" style="width: 100\%; height: 45px;">${bars}</svg>`;
        }

            if (confirm("Are you sure you want to clear all form fields?")) {
                document.querySelectorAll('input[type="text"], input[type="email"], textarea').forEach(el => el.value = '');
                document.querySelectorAll('input[type="checkbox"]').forEach(el => el.checked = false);
                document.querySelectorAll('select').forEach(el => el.selectedIndex = 0);
                handleDeviceChange();
            }
        }

        // Initialize display rules on load
        handleDeviceChange();
    </script>
</body>
</html>
