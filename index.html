<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Setup Sheet App</title>
    <!-- PWA Manifest Link -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#4b0082">
    <style>
        :root {
            --main-purple: #9b51e0;
            --light-purple: #f3e8ff;
            --label-purple: #8a2be2;
            --white: #ffffff;
            --app-bg: #e2d5f8;
        }

        body {
            margin: 0;
            padding: 20px;
            background-color: var(--app-bg);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
        }

        /* App Toolbar Styling */
        .app-toolbar {
            width: 100%;
            max-width: 210mm;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            background: var(--white);
            padding: 10px 15px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            box-sizing: border-box;
        }

        .toolbar-group {
            display: flex;
            gap: 10px;
        }

        .app-btn {
            background-color: var(--light-purple);
            color: var(--main-purple);
            border: 2px solid var(--main-purple);
            padding: 8px 14px;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .app-btn:hover {
            background-color: var(--main-purple);
            color: var(--white);
        }

        .app-btn.primary {
            background-color: var(--main-purple);
            color: var(--white);
        }

        .app-btn.primary:hover {
            background-color: #8a2be2;
        }

        /* Responsive A4 Paper Styling */
        .a4-sheet {
            width: 100%;
            max-width: 210mm;
            min-height: 297mm;
            background-color: var(--white);
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.15);
            padding: 12mm 15mm;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            margin: 0 auto;
            border-radius: 4px;
        }

        /* Header Section */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            border-bottom: 3px solid var(--main-purple);
            padding-bottom: 10px;
            margin-bottom: 15px;
        }

        .header h1 {
            color: var(--main-purple);
            margin: 0;
            font-size: 32px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        /* Device Icon Container */
        .device-icon-container {
            width: 60px;
            height: 60px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Form Grid Layout */
        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px 20px;
            margin-bottom: 20px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .full-width {
            grid-column: span 2;
        }

        /* Form Elements Styling */
        label {
            color: var(--label-purple);
            font-weight: bold;
            font-size: 14px;
        }

        input[type="text"],
        input[type="date"],
        select,
        textarea {
            width: 100%;
            padding: 8px 10px;
            border: 2px solid #d8b4fe;
            border-radius: 6px;
            font-size: 15px;
            box-sizing: border-box;
            color: #333;
            background-color: var(--white);
            transition: border-color 0.2s;
            font-family: inherit;
        }

        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: var(--main-purple);
            background-color: var(--light-purple);
        }

        textarea {
            resize: vertical;
        }

        /* Section Titles */
        .section-title {
            color: var(--main-purple);
            border-bottom: 2px solid var(--light-purple);
            padding-bottom: 5px;
            margin: 0 0 15px 0;
            font-size: 18px;
            text-transform: uppercase;
        }

        /* Services Grid */
        .services-grid {
            display: grid;
            grid-template-columns: repeat(12, 1fr);
            gap: 15px;
            margin-bottom: 20px;
        }

        .service-card {
            background-color: var(--light-purple);
            border: 2px solid var(--main-purple);
            border-radius: 8px;
            padding: 12px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            justify-content: center;
            align-items: center;
            text-align: center;
        }

        .service-card label {
            color: var(--main-purple);
            font-size: 14px;
            margin: 0;
            text-align: center;
        }

        .service-card select {
            border: 1px solid var(--main-purple);
            padding: 6px;
            text-align: center;
        }

        .service-card.checkbox-card {
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 8px;
            cursor: pointer;
            text-align: center;
        }

        .service-card.checkbox-card input[type="checkbox"] {
            width: 20px;
            height: 20px;
            accent-color: var(--main-purple);
            cursor: pointer;
            margin: 0;
        }

        .service-card.checkbox-card span {
            cursor: pointer;
            color: var(--main-purple);
            font-weight: bold;
            font-size: 14px;
            text-align: center;
        }

        /* Promo Banner */
        .promo-banner {
            background-color: var(--light-purple);
            border: 1.5px dashed var(--main-purple);
            padding: 5px 8px;
            border-radius: 6px;
            margin-bottom: 4px;
            font-size: 11px;
            color: var(--main-purple);
            font-weight: 600;
            line-height: 1.25;
            text-align: center;
            display: none;
        }

        .promo-banner p {
            margin: 0 0 2px 0;
        }

        .promo-banner p:last-child {
            margin-bottom: 0;
        }

        /* Notes Section */
        .notes-section {
            display: flex;
            flex-direction: column;
            gap: 3px;
        }

        /* Mobile Responsiveness */
        @media (max-width: 700px) {
            .app-toolbar {
                flex-direction: column;
                gap: 10px;
            }
            .toolbar-group {
                width: 100%;
                justify-content: center;
            }
            .form-grid {
                grid-template-columns: 1fr;
            }
            .full-width {
                grid-column: span 1;
            }
            .services-grid {
                grid-template-columns: 1fr 1fr !important;
            }
            .service-card {
                grid-column: span 1 !important;
            }
        }

        @media (max-width: 500px) {
            .services-grid {
                grid-template-columns: 1fr !important;
            }
            .service-card {
                grid-column: span 1 !important;
            }
        }

        /* Print Settings - Balanced spacing with 20-line notes fitting single-page A4 */
        @page {
            size: A4;
            margin: 0;
        }

        @media print {
            body {
                background: none;
                padding: 0;
                margin: 0;
                align-items: flex-start;
            }
            .app-toolbar {
                display: none !important;
            }
            .lookup-container {
                display: none !important; /* Hide postcode search input & button when printing */
            }
            .a4-sheet {
                box-shadow: none;
                padding: 8mm 12mm !important;
                width: 210mm !important;
                height: 297mm !important;
                max-height: 297mm !important;
                overflow: hidden !important;
                box-sizing: border-box !important;
                border-radius: 0;
                margin: 0;
            }
            .header {
                padding-bottom: 4px !important;
                margin-bottom: 8px !important;
            }
            .header h1 {
                font-size: 24px !important;
            }
            .form-grid {
                gap: 5px 12px !important;
                margin-bottom: 8px !important;
            }
            label {
                font-size: 11.5px !important;
            }
            input[type="text"],
            input[type="date"],
            select,
            textarea {
                padding: 3.5px 7px !important;
                font-size: 12px !important;
                border: 2px solid var(--main-purple) !important;
            }
            .section-title {
                font-size: 13.5px !important;
                margin: 0 0 5px 0 !important;
                padding-bottom: 2px !important;
            }
            .services-grid {
                gap: 8px !important;
                margin-bottom: 8px !important;
            }
            .service-card {
                padding: 5px !important;
                gap: 3px !important;
                border: 2px solid var(--main-purple) !important;
                background-color: var(--light-purple) !important;
                -webkit-print-color-adjust: exact !important;
                print-color-adjust: exact !important;
            }
            .service-card label, .service-card span {
                font-size: 11.5px !important;
            }
            .service-card select {
                padding: 2.5px !important;
                font-size: 11.5px !important;
            }
            .service-card.checkbox-card input[type="checkbox"] {
                width: 13px;
                height: 13px;
            }
            .promo-banner {
                padding: 3px 6px !important;
                font-size: 10px !important;
                margin-bottom: 3px !important;
                border: 1.5px dashed var(--main-purple) !important;
                background-color: var(--light-purple) !important;
                -webkit-print-color-adjust: exact !important;
                print-color-adjust: exact !important;
            }
            textarea#notes {
                height: 275px !important; /* Explicitly sized to fit 20 lines perfectly */
            }
            svg {
                width: 42px !important;
                height: 42px !important;
                -webkit-print-color-adjust: exact;
                print-color-adjust: exact;
            }
        }
    </style>
</head>
<body>

    <!-- App Control Toolbar -->
    <div class="app-toolbar">
        <div class="toolbar-group">
            <button class="app-btn" onclick="clearAppData()">🗑️ Clear Form</button>
        </div>
        <div class="toolbar-group">
            <button class="app-btn primary" onclick="window.print()">🖨️ Print / Export PDF</button>
        </div>
    </div>

    <div class="a4-sheet">
        <header class="header">
            <div>
                <h1>Setup Sheet</h1>
                <p style="color: var(--main-purple); margin: 3px 0 0 0; font-weight: bold; font-size: 13px;">Device Configuration & Services</p>
            </div>
            <div class="device-icon-container" id="icon-container"></div>
        </header>

        <form class="form-grid" id="setup-form" autocomplete="off">
            <div class="form-group">
                <label for="device">Device Type</label>
                <select id="device" onchange="handleDeviceChange()">
                    <option value="none">-- Select Device --</option>
                    <option value="laptop">Laptop</option>
                    <option value="aio">All in one</option>
                    <option value="tower">Tower</option>
                    <option value="mobile">Mobile phone</option>
                    <option value="tablet">Tablet</option>
                </select>
            </div>

            <div class="form-group">
                <label for="productCode">Item & Product Code</label>
                <input type="text" id="productCode" placeholder="e.g. LAP123-45678" autocomplete="off">
            </div>

            <div class="form-group">
                <label for="customerName">Customer Name</label>
                <input type="text" id="customerName" placeholder="Enter full name" autocomplete="off">
            </div>

            <div class="form-group">
                <label for="colleagueName">You were served by</label>
                <input type="text" id="colleagueName" placeholder="First Name" autocomplete="off">
            </div>

            <div class="form-group full-width">
                <label for="categoryType">Receipt / CUR / Medics</label>
                <select id="categoryType">
                    <option value="">-- Select Type --</option>
                    <option value="receipt">Receipt</option>
                    <option value="cur">CUR</option>
                    <option value="medics">Medics</option>
                </select>
            </div>

            <div class="form-group full-width">
                <label for="address">Full Address & Postcode Lookup</label>
                <div class="lookup-container" style="display: flex; gap: 8px; margin-bottom: 6px;">
                    <input type="text" id="postcodeSearch" placeholder="Enter Postcode (e.g. CW1 2AA)" autocomplete="off" style="flex: 1;" onkeydown="if(event.key === 'Enter'){event.preventDefault(); searchPostcode();}">
                    <button type="button" class="app-btn" style="padding: 6px 12px; font-size: 13px;" onclick="searchPostcode()">🔍 Find Address</button>
                </div>
                <select id="addressDropdown" class="lookup-container" style="display: none; margin-bottom: 6px;" onchange="selectAddress(this)">
                    <option value="">-- Select address from list --</option>
                </select>
                <textarea id="address" rows="2" placeholder="Customer full address (auto-filled or type manually)" autocomplete="off"></textarea>
            </div>

            <div class="form-group">
                <label for="dob">Date of Birth</label>
                <input type="date" id="dob" autocomplete="off">
            </div>

            <div class="form-group">
                <label for="contactNumber">Best Contact Number</label>
                <input type="text" id="contactNumber" placeholder="Enter phone number" autocomplete="off">
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input type="text" id="password" placeholder="Account Password" autocomplete="new-password">
            </div>

            <div class="form-group">
                <label for="pin">Pin</label>
                <input type="text" id="pin" placeholder="Device PIN" autocomplete="new-password">
            </div>

            <div class="form-group" id="imei-group" style="display: none;">
                <label for="imei">IMEI number (Trade in)</label>
                <input type="text" id="imei" placeholder="Enter IMEI number" autocomplete="off">
            </div>

            <div class="form-group" id="preorder-group" style="display: none;">
                <label for="preorder">Pre-order</label>
                <select id="preorder">
                    <option value="">-- Select --</option>
                    <option value="yes">Yes</option>
                    <option value="no">No</option>
                </select>
            </div>
        </form>

        <h3 class="section-title">Services & Protection</h3>
        
        <div class="services-grid" id="services-grid">
            <div class="service-card" id="antivirus-card">
                <label for="antivirus">Anti-virus</label>
                <select id="antivirus"></select>
            </div>

            <div class="service-card" id="office-card">
                <label for="office">Office</label>
                <select id="office"></select>
            </div>

            <div class="service-card" id="privacy-card">
                <label for="privacyGuard">Privacy Guard</label>
                <select id="privacyGuard"></select>
            </div>

            <div class="service-card" id="zagg-card">
                <label for="zagg">Zagg Screen Protector</label>
                <select id="zagg"></select>
            </div>

            <label class="service-card checkbox-card" id="cloud-card">
                <span>Cloud Storage</span>
                <input type="checkbox" id="cloudCheck"> 
            </label>

            <label class="service-card checkbox-card" id="vpn-card">
                <span>VPN Service</span>
                <input type="checkbox" id="vpnCheck"> 
            </label>

            <label class="service-card checkbox-card" id="data-card">
                <span>Data Transfer</span>
                <input type="checkbox" id="dataCheck"> 
            </label>
        </div>

        <div class="notes-section">
            <h3 class="section-title" style="margin-bottom: 4px;">Additional Notes</h3>
            <div id="promo-banner" class="promo-banner"></div>
            <textarea id="notes" rows="20" placeholder="Enter setup notes, specific customer requests, or additional information here..." autocomplete="off"></textarea>
        </div>

    </div>

    <script>
        function populateYears(elementId) {
            const select = document.getElementById(elementId);
            select.innerHTML = '';
            for (let i = 0; i <= 25; i++) {
                const opt = document.createElement('option');
                opt.value = i;
                opt.textContent = i === 1 ? '1 Year' : `${i} Years`;
                select.appendChild(opt);
            }
        }

        populateYears('antivirus');
        populateYears('office');
        populateYears('privacyGuard');

        const zaggOptions = {
            all: [
                {value: 'none', text: 'None'},
                {value: 'elite', text: 'Elite'},
                {value: 'eco', text: 'Eco'},
                {value: 'extreme', text: 'Extreme'},
                {value: 'privacy-matte', text: 'Privacy Matte'},
                {value: 'matte', text: 'Matte'}
            ],
            laptop: [
                {value: 'none', text: 'None'},
                {value: 'privacy-matte', text: 'Privacy Matte'}
            ],
            tablet: [
                {value: 'none', text: 'None'},
                {value: 'elite', text: 'Elite'},
                {value: 'privacy-matte', text: 'Privacy Matte'}
            ]
        };

        function updateZaggDropdown(device) {
            const zaggSelect = document.getElementById('zagg');
            const zaggCard = document.getElementById('zagg-card');
            
            if (device === 'tower' || device === 'aio') {
                zaggCard.style.display = 'none';
                return;
            } else {
                zaggCard.style.display = 'flex';
            }

            zaggSelect.innerHTML = '';
            let allowed = zaggOptions.all;

            if (device === 'laptop') {
                allowed = zaggOptions.laptop;
            } else if (device === 'tablet') {
                allowed = zaggOptions.tablet;
            }

            allowed.forEach(opt => {
                const el = document.createElement('option');
                el.value = opt.value;
                el.textContent = opt.text;
                zaggSelect.appendChild(el);
            });
        }

        function updateOfficeVisibility(device) {
            const officeCard = document.getElementById('office-card');
            if (device === 'mobile') {
                officeCard.style.display = 'none';
            } else {
                officeCard.style.display = 'flex';
            }
        }

        const icons = {
            none: ``,
            laptop: `<svg viewBox="0 0 100 100" fill="#ffffff" stroke="#9b51e0" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"><rect x="15" y="25" width="70" height="45" rx="3" /><path d="M 5,75 L 95,75 L 85,82 L 15,82 Z" /></svg>`,
            aio: `<svg viewBox="0 0 100 100" fill="#ffffff" stroke="#9b51e0" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"><rect x="10" y="15" width="80" height="55" rx="4" /><path d="M 40,70 L 60,70 L 65,85 L 35,85 Z" /><line x1="25" y1="85" x2="75" y2="85" /></svg>`,
            tower: `<svg viewBox="0 0 100 100" fill="#ffffff" stroke="#9b51e0" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"><rect x="30" y="10" width="40" height="80" rx="3" /><rect x="35" y="20" width="30" height="12" /><rect x="35" y="38" width="30" height="4" /><circle cx="50" cy="70" r="5" /></svg>`,
            mobile: `<svg viewBox="0 0 100 100" fill="#ffffff" stroke="#9b51e0" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"><rect x="30" y="10" width="40" height="80" rx="8" /><circle cx="50" cy="80" r="4" /><line x1="40" y1="18" x2="60" y2="18" /></svg>`,
            tablet: `<svg viewBox="0 0 100 100" fill="#ffffff" stroke="#9b51e0" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"><rect x="15" y="10" width="70" height="80" rx="6" /><circle cx="50" cy="80" r="4" /></svg>`
        };

        async function searchPostcode() {
            const postcode = document.getElementById('postcodeSearch').value.trim();
            const dropdown = document.getElementById('addressDropdown');
            
            if (!postcode) {
                alert('Please enter a valid postcode first.');
                return;
            }

            const cleanPostcode = postcode.replace(/\s+/g, '').toUpperCase();
            const targetUrl = `https://api.homedata.co.uk/address/postcode/${cleanPostcode}/`;
            const proxyUrl = `https://corsproxy.io/?${encodeURIComponent(targetUrl)}`;
            
            try {
                const response = await fetch(proxyUrl);
                if (!response.ok) {
                    throw new Error('Postcode lookup failed');
                }
                const data = await response.json();
                
                if (data && data.addresses && data.addresses.length > 0) {
                    dropdown.innerHTML = '<option value="">-- Select address from list (' + data.addresses.length + ' found) --</option>';
                    data.addresses.forEach(item => {
                        const opt = document.createElement('option');
                        opt.value = item.address;
                        opt.textContent = item.address;
                        dropdown.appendChild(opt);
                    });
                    dropdown.style.display = 'block';
                } else {
                    alert('No addresses found for this postcode. Please type the address manually.');
                    dropdown.style.display = 'none';
                }
            } catch (err) {
                console.error(err);
                alert('Could not fetch addresses automatically. Please type the address manually below.');
                dropdown.style.display = 'none';
            }
        }

        function selectAddress(selectEl) {
            if (selectEl.value) {
                document.getElementById('address').value = selectEl.value;
            }
        }

        function handleDeviceChange() {
            const deviceSelect = document.getElementById('device');
            const iconContainer = document.getElementById('icon-container');
            const promoBanner = document.getElementById('promo-banner');
            const imeiGroup = document.getElementById('imei-group');
            const preorderGroup = document.getElementById('preorder-group');
            const selectedDevice = deviceSelect.value;
            
            iconContainer.innerHTML = icons[selectedDevice];
            updateZaggDropdown(selectedDevice);
            updateOfficeVisibility(selectedDevice);

            if (selectedDevice === 'mobile') {
                imeiGroup.style.display = 'flex';
                preorderGroup.style.display = 'flex';
            } else {
                imeiGroup.style.display = 'none';
                preorderGroup.style.display = 'none';
            }

            const cards = [
                document.getElementById('antivirus-card'),
                document.getElementById('office-card'),
                document.getElementById('privacy-card'),
                document.getElementById('zagg-card'),
                document.getElementById('cloud-card'),
                document.getElementById('vpn-card'),
                document.getElementById('data-card')
            ];

            if (['tower', 'aio', 'mobile'].includes(selectedDevice)) {
                cards.forEach(card => {
                    if (card.style.display !== 'none') {
                        card.style.gridColumn = 'span 4';
                    }
                });
            } else if (['laptop', 'tablet'].includes(selectedDevice)) {
                let visibleCount = 0;
                cards.forEach(card => {
                    if (card.style.display !== 'none') {
                        visibleCount++;
                        if (visibleCount <= 4) {
                            card.style.gridColumn = 'span 3';
                        } else {
                            card.style.gridColumn = 'span 4';
                        }
                    }
                });
            } else {
                cards.forEach(card => {
                    if (card.style.display !== 'none') {
                        card.style.gridColumn = 'span 3';
                    }
                });
            }

            if (['laptop', 'aio', 'tower'].includes(selectedDevice)) {
                promoBanner.innerHTML = `
                    <p>Internet running slow speak to your advisor about your bill and possible upgrade</p>
                    <p><strong>Please complete any back ups before coming in for your new device including WhatsApp</strong></p>
                    <p><strong>Please ensure your current password for Google or Apple to ensure a password reset isn't required and find my device and theft protection is TURNED OFF!!!</strong></p>
                    <p>Are you over paying for your mobile phone contract please speak to your advisor to see if we can beat the price!!!</p>
                `;
                promoBanner.style.display = 'block';
            } else if (selectedDevice === 'tablet') {
                promoBanner.innerHTML = `
                    <p>Internet running slow speak to your advisor about your bill and possible upgrade</p>
                    <p>Are you over paying for your mobile phone contract please speak to your advisor to see if we can beat the price!!!</p>
                    <p><strong>Please complete any back ups before coming in for your new device including WhatsApp</strong></p>
                    <p><strong>Please ensure your current password for Google or Apple to ensure a password reset isn't required and find my device and theft protection is TURNED OFF!!!</strong></p>
                `;
                promoBanner.style.display = 'block';
            } else if (selectedDevice === 'mobile') {
                promoBanner.innerHTML = `
                    <p>Internet running slow speak to your advisor about your bill and possible upgrade</p>
                    <p><strong>Please complete any back ups before coming in for your new device including WhatsApp</strong></p>
                    <p><strong>Please ensure your current password for Google or Apple to ensure a password reset isn't required and find my device and theft protection is TURNED OFF!!!</strong></p>
                `;
                promoBanner.style.display = 'block';
            } else {
                promoBanner.style.display = 'none';
            }
        }

        const fields = ['device', 'productCode', 'customerName', 'colleagueName', 'categoryType', 'postcodeSearch', 'addressDropdown', 'address', 'dob', 'contactNumber', 'password', 'pin', 'imei', 'preorder', 'antivirus', 'office', 'privacyGuard', 'zagg', 'cloudCheck', 'vpnCheck', 'dataCheck', 'notes'];

        function clearAppData() {
            if (confirm("Are you sure you want to clear all form fields?")) {
                fields.forEach(id => {
                    const el = document.getElementById(id);
                    if (el) {
                        if (el.type === 'checkbox') {
                            el.checked = false;
                        } else {
                            el.value = '';
                        }
                    }
                });
                document.getElementById('addressDropdown').style.display = 'none';
                handleDeviceChange();
            }
        }

        window.addEventListener('pageshow', (event) => {
            if (event.persisted) {
                clearAppData();
            }
        });

        handleDeviceChange();

        // Register Service Worker for PWA
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js').catch(err => console.log('ServiceWorker registration failed: ', err));
        }
    </script>
</body>
</html>
