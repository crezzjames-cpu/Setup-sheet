<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Setup Sheet & Service Barcodes</title>
    <meta name="theme-color" content="#4b0082">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Libre+Barcode+39&display=swap" rel="stylesheet">
    <style>
        :root {
            --main-purple: #9b51e0;
            --light-purple: #f3e8ff;
            --label-purple: #8a2be2;
            --white: #ffffff;
            --app-bg: #e2d5f8;
        }

        body {
            margin: 0;
            padding: 20px;
            background-color: var(--app-bg);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
        }

        /* App Toolbar Styling */
        .app-toolbar {
            width: 100%;
            max-width: 210mm;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            background: var(--white);
            padding: 10px 15px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            box-sizing: border-box;
        }

        .toolbar-group {
            display: flex;
            gap: 10px;
        }

        .app-btn {
            background-color: var(--light-purple);
            color: var(--main-purple);
            border: 2px solid var(--main-purple);
            padding: 8px 14px;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .app-btn:hover {
            background-color: var(--main-purple);
            color: var(--white);
        }

        .app-btn.primary {
            background-color: var(--main-purple);
            color: var(--white);
        }

        .app-btn.primary:hover {
            background-color: #8a2be2;
        }

        /* Responsive A4 Paper Styling */
        .a4-sheet {
            width: 100%;
            max-width: 210mm;
            min-height: 297mm;
            background-color: var(--white);
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.15);
            padding: 12mm 15mm;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            margin: 0 auto;
            border-radius: 4px;
        }

        /* Header Section */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 3px solid var(--main-purple);
            padding-bottom: 12px;
            margin-bottom: 15px;
        }

        .header h1 {
            color: var(--main-purple);
            margin: 0;
            font-size: 42px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .device-selector-container {
            display: flex;
            flex-direction: column;
            gap: 5px;
            max-width: 300px;
            width: 100%;
        }

        /* Device Icon Container */
        .device-icon-container {
            width: 75px;
            height: 75px;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-shrink: 0;
        }

        .device-icon-container svg {
            width: 100%;
            height: 100%;
        }

        /* Form Grid Layout */
        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px 20px;
            margin-bottom: 20px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .form-group.dob-group {
            text-align: center;
        }

        .full-width {
            grid-column: span 2;
        }

        /* Date of Birth Input Container */
        .dob-container {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        .dob-container input {
            text-align: center;
        }

        .dob-container input#dobDay,
        .dob-container input#dobMonth {
            width: 65px;
        }

        .dob-container input#dobYear {
            width: 95px;
        }

        .dob-separator {
            font-size: 18px;
            font-weight: bold;
            color: var(--main-purple);
            user-select: none;
        }

        /* Form Elements Styling */
        label {
            color: var(--label-purple);
            font-weight: bold;
            font-size: 14px;
        }

        input[type="text"],
        input[type="email"],
        select,
        textarea {
            width: 100%;
            padding: 8px 10px;
            border: 2px solid #d8b4fe;
            border-radius: 6px;
            font-size: 15px;
            box-sizing: border-box;
            color: #333;
            background-color: var(--white);
            transition: border-color 0.2s;
            font-family: inherit;
        }

        textarea#address {
            resize: vertical;
            min-height: 8.5em;
            line-height: 1.4;
        }

        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: var(--main-purple);
            background-color: var(--light-purple);
        }

        /* Section Titles */
        .section-title {
            color: var(--main-purple);
            border-bottom: 2px solid var(--light-purple);
            padding-bottom: 5px;
            margin: 0 0 15px 0;
            font-size: 18px;
            text-transform: uppercase;
        }

        /* Services Grid */
        .services-grid {
            display: grid;
            grid-template-columns: repeat(12, 1fr);
            gap: 15px;
            margin-bottom: 20px;
        }

        .service-card {
            background-color: var(--light-purple);
            border: 2px solid var(--main-purple);
            border-radius: 8px;
            padding: 10px 12px;
            display: flex;
            flex-direction: column;
            gap: 6px;
            justify-content: center;
            align-items: center;
            text-align: center;
        }

        .pen-tick-box {
            width: 16px;
            height: 16px;
            border: 2px solid var(--main-purple);
            border-radius: 3px;
            background-color: var(--white);
            flex-shrink: 0;
        }

        .service-card label {
            color: var(--main-purple);
            font-size: 14px;
            margin: 0;
            text-align: center;
        }

        .service-card select {
            border: 1px solid var(--main-purple);
            padding: 6px;
            text-align: center;
        }

        .service-card.checkbox-card {
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 6px;
            cursor: pointer;
            text-align: center;
        }

        .service-card.checkbox-card input[type="checkbox"] {
            width: 18px;
            height: 18px;
            accent-color: var(--main-purple);
            cursor: pointer;
            margin: 0;
        }

        .service-card.checkbox-card span {
            cursor: pointer;
            color: var(--main-purple);
            font-weight: bold;
            font-size: 14px;
            text-align: center;
        }

        /* Service Barcode Section Styling */
        .service-vouchers-container {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 20px;
            background: #ffffff;
            border-radius: 8px;
        }

        .voucher-cat-title {
            color: var(--main-purple);
            font-size: 16px;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            border-bottom: 2px solid var(--main-purple);
            padding-bottom: 4px;
            margin: 10px 0 6px 0;
        }

        .voucher-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 12px;
        }

        .voucher-card {
            background: var(--white);
            border: 2px solid var(--main-purple);
            border-radius: 8px;
            padding: 10px 8px;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
            transition: transform 0.15s, box-shadow 0.15s;
        }

        .voucher-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 10px rgba(155, 81, 224, 0.25);
            background: #faf5ff;
        }

        .voucher-name {
            font-weight: bold;
            font-size: 13px;
            color: #222;
            margin-bottom: 6px;
            min-height: 28px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .barcode-svg-container {
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 4px 0;
            background: #ffffff;
            padding: 4px 0;
        }

        .voucher-code {
            font-size: 14px;
            font-weight: 800;
            color: var(--main-purple);
            letter-spacing: 2px;
            font-family: monospace;
            background: var(--light-purple);
            padding: 3px 8px;
            border-radius: 4px;
            margin-top: 4px;
            width: calc(100% - 16px);
            box-sizing: border-box;
        }

        /* Promo Banner & Notes */
        .promo-banner {
            background-color: var(--light-purple);
            border: 1.5px dashed var(--main-purple);
            padding: 5px 8px;
            border-radius: 6px;
            margin-bottom: 4px;
            font-size: 11px;
            color: var(--main-purple);
            font-weight: 600;
            line-height: 1.25;
            text-align: center;
            display: none;
        }

        .notes-section {
            display: flex;
            flex-direction: column;
            gap: 3px;
        }

        /* Second & Third Page Styles */
        .second-page {
            display: none;
            flex-direction: row;
            padding: 0 !important;
            margin-top: 20px;
        }

        .receipt-space {
            width: 90mm;
            min-height: 100%;
            border-right: 2px dashed var(--main-purple);
            background-color: #faf5ff;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-shrink: 0;
            box-sizing: border-box;
        }

        .receipt-text {
            transform: rotate(-90deg);
            color: var(--main-purple);
            font-weight: bold;
            font-size: 24px;
            letter-spacing: 2px;
            opacity: 0.3;
            white-space: nowrap;
        }

        .tips-space {
            flex: 1;
            padding: 20mm 15mm;
            display: flex;
            flex-direction: column;
            gap: 20px;
            box-sizing: border-box;
        }

        .tips-title {
            color: var(--main-purple);
            font-size: 36px;
            text-transform: uppercase;
            border-bottom: 3px solid var(--main-purple);
            padding-bottom: 10px;
            margin: 0 0 10px 0;
            letter-spacing: 1px;
            text-align: center;
        }

        .tip-item {
            font-size: 18px;
            line-height: 1.5;
            color: #333;
            background: var(--light-purple);
            padding: 15px 20px;
            border-radius: 8px;
            border-left: 5px solid var(--main-purple);
            text-align: center;
        }

        .iphone-guide-page, .android-guide-page {
            display: none;
            flex-direction: column;
            gap: 18px;
            margin-top: 20px;
        }

        /* Mobile Responsiveness */
        @media (max-width: 700px) {
            .app-toolbar {
                flex-direction: column;
                gap: 10px;
            }
            .header {
                flex-direction: column;
                gap: 10px;
                align-items: flex-start;
            }
            .form-grid {
                grid-template-columns: 1fr;
            }
            .full-width {
                grid-column: span 1;
            }
            .services-grid {
                grid-template-columns: 1fr 1fr !important;
            }
            .voucher-grid {
                grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
            }
        }

        /* Print Settings */
        @page {
            size: A4;
            margin: 0;
        }

        @media print {
            body {
                background: none;
                padding: 0;
                margin: 0;
            }
            .app-toolbar {
                display: none !important;
            }
            .a4-sheet {
                box-shadow: none;
                padding: 8mm 12mm !important;
                width: 210mm !important;
                min-height: 297mm !important;
                border-radius: 0;
                margin: 0;
            }
            .voucher-card {
                break-inside: avoid;
                border: 1.5px solid var(--main-purple) !important;
                -webkit-print-color-adjust: exact !important;
                print-color-adjust: exact !important;
            }
            .voucher-code {
                background-color: var(--light-purple) !important;
                -webkit-print-color-adjust: exact !important;
                print-color-adjust: exact !important;
            }
        }
    </style>
</head>
<body>

    <!-- App Control Toolbar -->
    <div class="app-toolbar">
        <div class="toolbar-group">
            <button class="app-btn" onclick="clearAppData()">🗑️ Clear Form</button>
        </div>
        <div class="toolbar-group">
            <button class="app-btn primary" onclick="window.print()">🖨️ Print</button>
        </div>
    </div>

    <!-- Main Page: Setup Sheet / Services Barcodes -->
    <div class="a4-sheet">
        <header class="header">
            <div>
                <h1 id="page-main-title">Setup Sheet</h1>
                <p id="page-sub-title" style="color: var(--main-purple); margin: 3px 0 0 0; font-weight: bold; font-size: 13px;">Device Configuration & Services</p>
            </div>
            
            <div class="device-selector-container">
                <label for="device">Device Type</label>
                <select id="device" onchange="handleDeviceChange()">
                    <option value="none">-- Select --</option>
                    <option value="laptop">Laptop</option>
                    <option value="aio">All in one</option>
                    <option value="tower">Tower</option>
                    <option value="mobile">Mobile phone</option>
                    <option value="tablet">Tablet</option>
                    <option value="services">Services</option>
                </select>
            </div>

            <div class="device-icon-container" id="icon-container"></div>
        </header>

        <!-- Customer & Device Details Form (Hidden when Services selected) -->
        <div id="customer-fields-container">
            <form class="form-grid" id="setup-form" autocomplete="off">
                <div class="form-group">
                    <label for="colleagueName"> You were served by</label>
                    <input type="text" id="colleagueName" placeholder="First Name" autocomplete="off">
                </div>

                <div class="form-group">
                    <label for="customerName">Customer Name</label>
                    <input type="text" id="customerName" placeholder="Enter full name" autocomplete="off">
                </div>

                <div class="form-group">
                    <label for="item">Item</label>
                    <input type="text" id="item" placeholder="Enter item" autocomplete="off">
                </div>

                <div class="form-group">
                    <label for="productCode">Product Code</label>
                    <input type="text" id="productCode" placeholder="e.g. LAP123" autocomplete="off">
                </div>

                <div class="form-group">
                    <label for="receiptCur">Receipt / CUR</label>
                    <input type="text" id="receiptCur" placeholder="Enter Receipt / CUR" autocomplete="off">
                </div>

                <div class="form-group">
                    <label for="medics">Medics</label>
                    <input type="text" id="medics" placeholder="Enter Medics" autocomplete="off">
                </div>

                <div class="form-group">
                    <label for="contactNumber">Best Contact Number</label>
                    <input type="text" id="contactNumber" placeholder="Enter phone number" autocomplete="off">
                </div>

                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" placeholder="Enter email address" autocomplete="email">
                </div>

                <div class="form-group">
                    <label for="altEmail">Alternative Email Address</label>
                    <input type="email" id="altEmail" placeholder="Enter alternative email address" autocomplete="email">
                </div>

                <div class="form-group dob-group">
                    <label>Date of Birth <span style="font-weight: normal; font-size: 0.9em;">(for account creation)</span></label>
                    <div class="dob-container">
                        <input type="text" id="dobDay" placeholder="DD" maxlength="2" autocomplete="off">
                        <span class="dob-separator">/</span>
                        <input type="text" id="dobMonth" placeholder="MM" maxlength="2" autocomplete="off">
                        <span class="dob-separator">/</span>
                        <input type="text" id="dobYear" placeholder="YYYY" maxlength="4" autocomplete="off">
                    </div>
                </div>

                <div class="form-group full-width">
                    <label for="address">Full Address</label>
                    <textarea id="address" rows="4" placeholder="Enter customer's full address" autocomplete="off"></textarea>
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="text" id="password" placeholder="Account Password" autocomplete="new-password">
                </div>

                <div class="form-group">
                    <label for="pin">Pin</label>
                    <input type="text" id="pin" placeholder="Device PIN" autocomplete="new-password">
                </div>

                <div class="form-group" id="imei-group" style="display: none;">
                    <label for="imei">IMEI number (Trade in)</label>
                    <input type="text" id="imei" placeholder="Enter IMEI number" autocomplete="off">
                </div>

                <div class="form-group" id="preorder-group" style="display: none;">
                    <label for="preorder">Pre-order</label>
                    <select id="preorder">
                        <option value="">-- Select --</option>
                        <option value="yes">Yes</option>
                        <option value="no">No</option>
                    </select>
                </div>
            </form>
        </div>

        <!-- Service Barcode Sheet Container (Sole focus when Services selected) -->
        <div class="service-vouchers-container" id="service-vouchers-container" style="display: none;">
            <h3 class="section-title" style="margin-bottom: 2px;">Service Codes & Barcodes Reference</h3>
            <div id="vouchers-content"></div>
        </div>

        <!-- Services & Protection Dropdowns/Checkboxes (Hidden when Services selected) -->
        <div id="services-grid-wrapper">
            <h3 class="section-title">Services & Protection</h3>
            <div class="services-grid" id="services-grid">
                <div class="service-card" id="antivirus-card">
                    <div class="pen-tick-box"></div>
                    <label for="antivirus">Anti-virus</label>
                    <select id="antivirus"></select>
                </div>

                <div class="service-card" id="office-card">
                    <div class="pen-tick-box"></div>
                    <label for="office">Office</label>
                    <select id="office"></select>
                </div>

                <div class="service-card" id="privacy-card">
                    <div class="pen-tick-box"></div>
                    <label for="privacyGuard">Privacy Guard</label>
                    <select id="privacyGuard"></select>
                </div>

                <div class="service-card" id="zagg-card">
                    <div class="pen-tick-box"></div>
                    <label for="zagg">Zagg Screen Protector</label>
                    <select id="zagg"></select>
                </div>

                <label class="service-card checkbox-card" id="cloud-card">
                    <div class="pen-tick-box"></div>
                    <span>Cloud Storage</span>
                    <input type="checkbox" id="cloudCheck"> 
                </label>

                <label class="service-card checkbox-card" id="vpn-card">
                    <div class="pen-tick-box"></div>
                    <span>VPN Service</span>
                    <input type="checkbox" id="vpnCheck"> 
                </label>

                <label class="service-card checkbox-card" id="data-card">
                    <div class="pen-tick-box"></div>
                    <span>Data Transfer</span>
                    <input type="checkbox" id="dataCheck"> 
                </label>

                <label class="service-card checkbox-card" id="iphone-trade-in-card" style="display: none;">
                    <div class="pen-tick-box"></div>
                    <span>iPhone trade in</span>
                    <input type="checkbox" id="iphoneTradeInCheck"> 
                </label>

                <label class="service-card checkbox-card" id="android-trade-in-card" style="display: none;">
                    <div class="pen-tick-box"></div>
                    <span>Android trade in</span>
                    <input type="checkbox" id="androidTradeInCheck"> 
                </label>

                <label class="service-card checkbox-card" id="ios-trade-in-card" style="display: none;">
                    <div class="pen-tick-box"></div>
                    <span>iOS trade in</span>
                    <input type="checkbox" id="iosTradeInCheck"> 
                </label>
            </div>
        </div>

        <!-- Notes & Promo Section (Hidden when Services selected) -->
        <div class="notes-section" id="notes-section">
            <h3 class="section-title" style="margin-bottom: 4px;">Additional Notes</h3>
            <div id="promo-banner" class="promo-banner"></div>
            <textarea id="notes" rows="6" placeholder="Enter setup notes, specific customer requests, or additional information here..." autocomplete="off"></textarea>
        </div>
    </div>

    <!-- Second Page: Helpful Tips & Receipt -->
    <div class="a4-sheet second-page" id="second-page">
        <div class="receipt-space">
            <span class="receipt-text">ATTACH RECEIPT HERE</span>
        </div>
        <div class="tips-space" id="tips-space"></div>
    </div>

    <script>
        /* Exact PDF Voucher Sheet Data */

        };

        /* High-Precision Pure SVG Code 39 Barcode Generator */
        function generateCode39SVG(code) {
            const charWidths = {
                '0': [1,1,1,2,2,1,2,1,1], '1': [2,1,1,1,1,1,1,1,2],
                '2': [1,1,2,1,1,1,1,1,2], '3': [2,1,2,1,1,1,1,1,1],
                '4': [1,1,1,1,2,1,1,1,2], '5': [2,1,1,1,2,1,1,1,1],
                '6': [1,1,2,1,2,1,1,1,1], '7': [1,1,1,1,1,1,2,1,2],
                '8': [2,1,1,1,1,1,2,1,1], '9': [1,1,2,1,1,1,2,1,1],
                '*': [1,2,1,1,2,1,1,1,1]
            };

            const fullCode = '*' + code + '*';
            let bars = '';
            let x = 10;
            const narrow = 2;
            const wide = 4.5;
            const height = 45;

            for (let c of fullCode) {
                const widths = charWidths[c] || charWidths['0'];
                for (let i = 0; i < 9; i++) {
                    const w = widths[i] === 2 ? wide : narrow;
                    const isBar = (i % 2 === 0);
                    if (isBar) {
                        bars += `<rect x="${x}" y="0" width="${w}" height="${height}" fill="#000000"/>`;
                    }
                    x += w;
                }
                x += narrow;
            }

            return `<svg viewBox="0 0 ${x + 10} ${height}" preserveAspectRatio="none" style="width: 100\%; height: 42px;">${bars}</svg>`;
        }

        function renderVouchers() {
            const container = document.getElementById('vouchers-content');
            container.innerHTML = '';

            for (const [category, vouchers] of Object.entries(serviceVouchersData)) {
                const catTitle = document.createElement('div');
                catTitle.className = 'voucher-cat-title';
                catTitle.textContent = category;
                container.appendChild(catTitle);

                const grid = document.createElement('div');
                grid.className = 'voucher-grid';

                vouchers.forEach(v => {
                    const card = document.createElement('div');
                    card.className = 'voucher-card';

                    const svgBarcode = generateCode39SVG(v.code);

                    card.innerHTML = `
                        <div class="voucher-name">${v.name}</div>
                        <div class="barcode-svg-container">${svgBarcode}</div>
                        <div class="voucher-code">${v.code}</div>
                    `;
                    grid.appendChild(card);
                });

                container.appendChild(grid);
            }
        }

        renderVouchers();

        function populateYears(elementId) {
            const select = document.getElementById(elementId);
            if (!select) return;
            select.innerHTML = '';
            for (let i = 0; i <= 25; i++) {
                const opt = document.createElement('option');
                opt.value = i;
                opt.textContent = i === 1 ? '1 Year' : `${i} Years`;
                select.appendChild(opt);
            }
        }

        populateYears('antivirus');
        populateYears('office');
        populateYears('privacyGuard');

        const zaggOptions = [
            {value: 'none', text: 'None'},
            {value: 'elite', text: 'Elite'},
            {value: 'eco', text: 'Extreme'},
            {value: 'extreme', text: 'Extreme'},
            {value: 'privacy-matte', text: 'Privacy Matte'},
            {value: 'matte', text: 'Matte'}
        ];

        const zaggSelect = document.getElementById('zagg');
        if (zaggSelect) {
            zaggOptions.forEach(opt => {
                const el = document.createElement('option');
                el.value = opt.value;
                el.textContent = opt.text;
                zaggSelect.appendChild(el);
            });
        }

        const icons = {
            none: ``,
            laptop: `<svg viewBox="0 0 100 100" fill="#ffffff" stroke="#9b51e0" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"><rect x="15" y="25" width="70" height="45" rx="3" /><path d="M 5,75 L 95,75 L 85,82 L 15,82 Z" /></svg>`,
            aio: `<svg viewBox="0 0 100 100" fill="#ffffff" stroke="#9b51e0" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"><rect x="10" y="15" width="80" height="55" rx="4" /><path d="M 40,70 L 60,70 L 65,85 L 35,85 Z" /><line x1="25" y1="85" x2="75" y2="85" /></svg>`,
            tower: `<svg viewBox="0 0 100 100" fill="#ffffff" stroke="#9b51e0" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"><rect x="30" y="10" width="40" height="80" rx="3" /><rect x="35" y="20" width="30" height="12" /><rect x="35" y="38" width="30" height="4" /><circle cx="50" cy="70" r="5" /></svg>`,
            mobile: `<svg viewBox="0 0 100 100" fill="#ffffff" stroke="#9b51e0" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"><rect x="30" y="10" width="40" height="80" rx="8" /><circle cx="50" cy="80" r="4" /><line x1="40" y1="18" x2="60" y2="18" /></svg>`,
            tablet: `<svg viewBox="0 0 100 100" fill="#ffffff" stroke="#9b51e0" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"><rect x="15" y="10" width="70" height="80" rx="6" /><circle cx="50" cy="80" r="4" /></svg>`,
            services: `<svg viewBox="0 0 100 100" fill="#ffffff" stroke="#9b51e0" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"><path d="M45,15 L55,15 L58,25 A30,30 0 0,1 66,30 L76,25 L81,34 L73,42 A30,30 0 0,1 73,50 L81,58 L76,67 L66,62 A30,30 0 0,1 58,67 L55,77 L45,77 L42,67 A30,30 0 0,1 34,62 L24,67 L19,58 L27,50 A30,30 0 0,1 27,42 L19,34 L24,25 L34,30 A30,30 0 0,1 42,25 Z"/><circle cx="50" cy="46" r="10"/></svg>`
        };

        function handleDeviceChange() {
            const deviceSelect = document.getElementById('device');
            const iconContainer = document.getElementById('icon-container');
            const selectedDevice = deviceSelect.value;

            const customerFields = document.getElementById('customer-fields-container');
            const servicesGridWrapper = document.getElementById('services-grid-wrapper');
            const notesSection = document.getElementById('notes-section');
            const vouchersContainer = document.getElementById('service-vouchers-container');
            const secondPage = document.getElementById('second-page');
            const mainTitle = document.getElementById('page-main-title');
            const subTitle = document.getElementById('page-sub-title');

            iconContainer.innerHTML = icons[selectedDevice] || '';

            if (selectedDevice === 'services') {
                /* STRICT REQUIREMENTS: Hide EVERYTHING except Device Selection & Barcodes */
                customerFields.style.display = 'none';
                servicesGridWrapper.style.display = 'none';
                notesSection.style.display = 'none';
                secondPage.style.display = 'none';
                vouchersContainer.style.display = 'flex';

                mainTitle.textContent = "Service Barcodes";
                subTitle.textContent = "Store Voucher & Service Code Reference";
            } else {
                /* Show normal setup sheet view */
                customerFields.style.display = 'block';
                servicesGridWrapper.style.display = 'block';
                notesSection.style.display = 'flex';
                vouchersContainer.style.display = 'none';

                mainTitle.textContent = "Setup Sheet";
                subTitle.textContent = "Device Configuration & Services";

                if (selectedDevice === 'none') {
                    secondPage.style.display = 'none';
                } else {
                    secondPage.style.display = 'flex';
                }
            }
        }

        function clearAppData() {
            if (confirm("Are you sure you want to clear all form fields?")) {
                document.querySelectorAll('input[type="text"], input[type="email"], textarea').forEach(el => el.value = '');
                document.querySelectorAll('input[type="checkbox"]').forEach(el => el.checked = false);
                document.querySelectorAll('select').forEach(el => el.selectedIndex = 0);
                handleDeviceChange();
            }
        }

        handleDeviceChange();
    </script>
</body>
</html>
